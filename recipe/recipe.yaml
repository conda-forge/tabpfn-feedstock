schema_version: 1

context:
  name: tabpfn
  version: "9.0.0"
  python_min: '3.11'

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/tabpfn-${{ version }}.tar.gz
  sha256: a4a845309b682eb3d58065eb5cec72e585dde3f639489a36e18948a8ace4245c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - pip
  run:
    - joblib >=1.2.0
    - tabpfn-common-utils >=0.2.13
    - python >=${{ python_min }}
    - einops >=0.4.0
    - eval-type-backport >=0.2.2
    - pandas >=1.4.0
    - pydantic >=2.8.0
    - pydantic-settings >=2.10.1
    - pytorch >=2.5
    - scikit-learn >=1.2.0
    - scipy >=1.11.1
    - typing_extensions >=4.12.0
    - numpy >=1.21.6
    - huggingface_hub >=0.23.0
    - filelock >=3.11.0
    - lightgbm >=3.0
    - safetensors
    - tqdm >=4.66.0
    # skrub <0.10.1 breaks with joblib >=1.6.0, which dropped its vendored
    # cloudpickle (joblib.externals.cloudpickle); fixed in skrub 0.10.1.
    - skrub >=0.10.1,<0.11
    - matplotlib-base >=3.6.1
tests:
  - python:
      imports:
        - tabpfn
      pip_check: true

      python_version: ${{ python_min }}.*
about:
  summary: Foundation model for tabular data
  license: Apache-2.0
  license_file:
    - LICENSE
  homepage: https://github.com/PriorLabs/TabPFN

extra:
  recipe-maintainers:
    - anuprulez
    - janjagusch
